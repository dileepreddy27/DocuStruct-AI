services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://docustruct:docustruct@postgres:5432/docustruct
      STORAGE_ROOT: /app/data/uploads
      REVIEW_CONFIDENCE_THRESHOLD: "0.80"
    ports: ["${APP_PORT:-8000}:8000"]
    volumes: ["uploads:/app/data/uploads"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docustruct
      POSTGRES_USER: docustruct
      POSTGRES_PASSWORD: docustruct
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docustruct"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  uploads:
  postgres-data:
