[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docustruct-ai"
version = "0.1.0"
description = "PDF-to-validated-data platform with review workflows"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.14.1",
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "jsonschema==4.23.0",
  "pydantic-settings==2.7.1",
  "pymupdf==1.25.3",
  "python-multipart==0.0.20",
  "sqlalchemy==2.0.38",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.4"]
ocr = ["pillow==11.1.0", "pytesseract==0.3.13"]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "ruff==0.9.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]
